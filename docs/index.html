<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arsenal">
  <title>Arsenal</title>
  <meta name="description" content="Arsenal matches, live scores, news and the table.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32-v2.png">
  <link rel="apple-touch-icon" href="icon-192-v2.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="Arsenal, home">
      <img src="crest-96.png" alt="" width="28" height="28">
      <span>Arsenal</span>
    </a>
    <nav class="topnav" aria-label="Sections">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/matches" data-nav="matches">Matches</a>
      <a href="#/news" data-nav="news">News</a>
      <a href="#/table" data-nav="table">Table</a>
    </nav>
    <div class="top-status">
      <span id="updated" aria-live="off"></span>
      <button type="button" class="refresh" id="refresh" hidden aria-label="Fetch the latest news now">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
  </header>

  <div id="livebar"></div>

  <main class="layout" id="main">
    <div class="col-main">
      <div id="status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
      <div id="view" tabindex="-1">
        <div class="loading" aria-label="Loading"><i></i><i></i><i></i></div>
      </div>
    </div>
    <aside class="col-rail" id="rail" aria-label="More"></aside>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#/" data-nav="home">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#/matches" data-nav="matches">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h3M8 17h6"/></svg>Matches</a>
    <a href="#/news" data-nav="news">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a1 1 0 0 1 1 1v14a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1z"/><path d="M17 9h2a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2"/><path d="M8 8h5M8 12h5M8 16h3"/></svg>News</a>
    <a href="#/table" data-nav="table">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><path d="M8.5 4v16"/></svg>Table</a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
